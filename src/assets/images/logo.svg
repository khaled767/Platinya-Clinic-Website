<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <!-- Gold Gradient for Icon -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C358"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B89535"/>
    </linearGradient>

    <!-- Gold Gradient for Text -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C358"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B89535"/>
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="goldGlow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ==================== LEFT: LOGOMARK / EMBLEM ==================== -->

  <!-- Outer shield / diamond shape -->
  <g filter="url(#goldGlow)">
    <!-- Background diamond -->
    <path d="M26,8 L46,8 L54,24 L46,40 L26,40 L18,24 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- Inner diamond -->
    <path d="M28,12 L44,12 L50,24 L44,36 L28,36 L22,24 Z"
          fill="url(#goldGrad)" opacity="0.12"/>

    <!-- Medical cross with luxury styling -->
    <g transform="translate(36, 24)">
      <!-- Vertical bar -->
      <rect x="-2.5" y="-7" width="5" height="14" rx="1.2"
            fill="url(#goldGrad)" opacity="0.9"/>
      <!-- Horizontal bar -->
      <rect x="-7" y="-2.5" width="14" height="5" rx="1.2"
            fill="url(#goldGrad)" opacity="0.9"/>
      <!-- Center circle accent -->
      <circle cx="0" cy="0" r="2.5" fill="#0F172A" opacity="0.8"/>
    </g>

    <!-- Decorative top gem -->
    <circle cx="36" cy="10" r="1.5" fill="url(#goldGrad)" opacity="0.6"/>

    <!-- Decorative bottom point accent -->
    <circle cx="36" cy="38" r="1.2" fill="url(#goldGrad)" opacity="0.5"/>
  </g>

  <!-- ==================== RIGHT: WORDMARK ==================== -->

  <!-- Brand Name: PLATINYA -->
  <g filter="url(#goldGlow)">
    <text x="70" y="40" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, 'Times New Roman', serif"
          font-size="32" font-weight="700" letter-spacing="6"
          fill="url(#goldTextGrad)">
      PLATINYA
    </text>
  </g>

  <!-- Tagline -->
  <text x="70" y="56" font-family="'Inter', 'Plus Jakarta Sans', Arial, sans-serif"
        font-size="9.5" font-weight="500" letter-spacing="4.5"
        fill="#D4AF37" opacity="0.85">
    HEALTHCARE CONCIERGE
  </text>

  <!-- Decorative line under tagline -->
  <line x1="70" y1="62" x2="240" y2="62"
        stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.5"/>

  <!-- Small decorative dots on line -->
  <circle cx="238" cy="62" r="1" fill="url(#goldGrad)" opacity="0.4"/>
</svg>
