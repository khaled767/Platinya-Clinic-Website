  <script>
    // SPA fallback for GitHub Pages: send any unknown route back to the hash root.
    (function () {
      var path = location.pathname;
      if (path && !path.endsWith("/")) {
        // keep any existing hash, else go home
        location.replace("./" + location.search + (location.hash || "#/"));
      } else if (!location.hash) {
        location.replace("./#/");
      }
    })();
  </script>
